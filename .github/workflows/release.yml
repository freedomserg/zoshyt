# push у main → образ у GHCR (ghcr.io/freedomserg/zoshyt:<sha12> і :latest)
# → ssh-деплой на VPS: scp конфігів (compose, Caddyfile, ops/db/init.sh, ops/backup/*.sh) →
# IMAGE_TAG=<sha12> compose pull && up -d (migrate → api, bot) → caddy reload.
# Тег = коміт: відкат на VPS — це `compose up` зі старим тегом, не пересборка.
# Людські версії X.Y.Z — tag-release.yml (ADR-0013).
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.sha12 }}
    steps:
      - uses: actions/checkout@v7
      # 12 символів sha — той самий формат тегу, що й у lozar; його ж шукає tag-release.yml.
      - name: Image tag = first 12 chars of commit sha
        id: tag
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/freedomserg/zoshyt:${{ steps.tag.outputs.sha12 }}
            ghcr.io/freedomserg/zoshyt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 10
    env:
      VPS: deploy@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7
      # Без сторонніх ssh-actions: ключ і known_hosts кладемо самі —
      # менше чужого коду з доступом до секрету.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      # Конфіги і скрипти на VPS — завжди з того самого коміту, що й образ: руками
      # там живуть лише .env і backup/age.key (scp конкретних файлів ключ не чіпає).
      # scp пише у файл на місці (той самий inode), тож bind-mount Caddyfile у
      # контейнері бачить новий вміст; -p зберігає +x на скриптах.
      - name: Sync compose, Caddyfile, DB init and backup scripts
        run: |
          ssh "$VPS" 'mkdir -p /opt/zoshyt/ops/db /opt/zoshyt/backup'
          scp -p docker-compose.prod.yml Caddyfile "$VPS":/opt/zoshyt/
          scp -p ops/db/init.sh "$VPS":/opt/zoshyt/ops/db/
          scp -p ops/backup/backup.sh ops/backup/restore-drill.sh "$VPS":/opt/zoshyt/backup/
      # Відкат образу: на VPS той самий рядок зі старим IMAGE_TAG (конфіги лишаться
      # новими). Відкат разом з конфігами: Re-run цього воркфлоу на старому коміті.
      # caddy reload — бо up -d не перестворює контейнер через зміну змонтованого
      # файлу; одна повторна спроба — на випадок щойно створеного контейнера.
      # image prune — щоб старі образи не з'їли диск тихо. Саме `-a`: кожен образ
      # тут має тег :<sha12> і ніколи не стає «висячим», тож звичайний `prune -f`
      # не прибрав би нічого (у lozar він працював, поки там тягнувся :latest).
      # `-a` прибирає образи без контейнерів; ті, що в роботі (наш поточний,
      # postgres, caddy), не чіпає. until=168h — тиждень старих образів лишається
      # на диску для миттєвого відкату; старіший тег docker просто стягне з GHCR.
      # Стоїть ПІСЛЯ up -d під set -e: якщо деплой впав, нічого не видаляється.
      - name: Deploy
        run: |
          ssh "$VPS" '
            set -e
            cd /opt/zoshyt
            export IMAGE_TAG=${{ needs.publish-image.outputs.tag }}
            compose="docker compose -f docker-compose.prod.yml"
            $compose pull -q
            $compose up -d
            reload="$compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile"
            $reload || { sleep 5; $reload; }
            docker image prune -af --filter "until=168h"
          '
