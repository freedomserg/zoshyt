# Alembic: конфіг міграцій. Запуск — з кореня репо: `uv run alembic upgrade head`.
# URL БД тут НЕ зберігається — env.py бере DB_URL з config.py (один секрет в одному місці).
#
# Нова ревізія — ім'я задається руками (CLAUDE.md: YYYYMMDD_n_slug, не хеш):
#   uv run alembic revision --rev-id 20260914_1 -m "events"
#   uv run alembic revision --rev-id 20260914_1 -m "events" --autogenerate   # чернетка, читати очима

[alembic]
script_location = %(here)s/src/zoshyt/db/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Логування: alembic — INFO (щоб бачити "Running upgrade ..."), решта — WARNING.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
